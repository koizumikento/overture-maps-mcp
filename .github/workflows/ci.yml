name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: uv sync --frozen
      - name: Prepare DuckDB extension (no map data)
        run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .
      - run: uv run pytest
      - run: uv build
      - name: Clean wheel registration
        run: uv run --isolated --no-project --with dist/overture_maps_mcp-0.1.0-py3-none-any.whl python -c "import asyncio; from overture_maps_mcp.server import mcp; assert len(asyncio.run(mcp.list_tools())) == 5"
