[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "overture-maps-mcp"
version = "0.1.0"
description = "Read-only MCP search and spatial analysis across all six Overture Maps themes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "straydog"}]
dependencies = [
    "duckdb>=1.5.0,<2",
    "httpx>=0.28.1,<1",
    "mcp>=2.2.0,<3",
    "pydantic>=2.13.5,<3",
]

[project.scripts]
overture-maps-mcp = "overture_maps_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/overture_maps_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
